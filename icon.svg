<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="55%" stop-color="#151c38"/>
      <stop offset="100%" stop-color="#0a0f24"/>
    </linearGradient>

    <!-- Center Ambient Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="48%" r="48%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#facc15" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Golden Coin Glow -->
    <radialGradient id="coinGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#facc15" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#facc15" stop-opacity="0"/>
    </radialGradient>

    <!-- Coin Gradient -->
    <linearGradient id="coinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>

    <!-- Clip Path for Squircle -->
    <clipPath id="squircleClip">
      <rect width="512" height="512" rx="108" ry="108"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircleClip)">
    <!-- 1. Background -->
    <rect width="512" height="512" fill="url(#bgGrad)"/>
    <rect width="512" height="512" fill="url(#centerGlow)"/>

    <!-- 2. Sparkle Stars in Sky -->
    <circle cx="70" cy="90" r="3" fill="#fef08a"/>
    <circle cx="120" cy="160" r="2" fill="#fef08a"/>
    <circle cx="420" cy="80" r="3" fill="#fef08a"/>
    <circle cx="440" cy="150" r="2" fill="#38bdf8"/>
    <circle cx="90" cy="340" r="2" fill="#fef08a"/>
    <circle cx="430" cy="330" r="3" fill="#38bdf8"/>
    <circle cx="256" cy="70" r="2.5" fill="#fef08a"/>
    <circle cx="350" cy="105" r="2" fill="#fef08a"/>

    <!-- 3. Platform Shadow -->
    <ellipse cx="256" cy="455" rx="140" ry="18" fill="rgba(0,0,0,0.55)"/>

    <!-- 4. Floating Platform -->
    <!-- Dirt Body -->
    <rect x="106" y="381" width="300" height="59" rx="18" ry="18" fill="#92400e"/>
    <!-- Dirt Pixel Accents -->
    <rect x="130" y="397" width="22" height="14" fill="#78350f"/>
    <rect x="196" y="409" width="26" height="12" fill="#78350f"/>
    <rect x="281" y="399" width="24" height="14" fill="#78350f"/>
    <rect x="351" y="409" width="24" height="12" fill="#78350f"/>

    <!-- Grass Top -->
    <rect x="106" y="365" width="300" height="20" rx="8" ry="8" fill="#22c55e"/>
    <rect x="106" y="365" width="300" height="5" fill="#4ade80"/>
    <!-- Grass Tufts -->
    <rect x="124" y="385" width="12" height="9" fill="#22c55e"/>
    <rect x="162" y="385" width="12" height="9" fill="#22c55e"/>
    <rect x="201" y="385" width="12" height="9" fill="#22c55e"/>
    <rect x="246" y="385" width="12" height="9" fill="#22c55e"/>
    <rect x="291" y="385" width="12" height="9" fill="#22c55e"/>
    <rect x="336" y="385" width="12" height="9" fill="#22c55e"/>
    <rect x="374" y="385" width="12" height="9" fill="#22c55e"/>

    <!-- 5. Ninja Frog Character (High-res Embedded Sprite) -->
    <image x="145" y="185" width="192" height="192" style="image-rendering: pixelated; filter: drop-shadow(0 14px 18px rgba(0,0,0,0.6));" href="data:image/png;base64,"/>

    <!-- 6. Floating Golden Coin -->
    <circle cx="360" cy="185" r="70" fill="url(#coinGlow)"/>
    <circle cx="360" cy="185" r="44" fill="#f59e0b"/>
    <circle cx="360" cy="185" r="38" fill="url(#coinGrad)"/>
    <circle cx="360" cy="185" r="28" fill="#ca8a04"/>
    <rect x="356" y="171" width="8" height="28" fill="#fef08a" rx="2"/>
    <rect x="346" y="181" width="28" height="8" fill="#fef08a" rx="2"/>

    <!-- Sparkles -->
    <!-- Large White Sparkle -->
    <path d="M422,116 Q422,130 436,130 Q422,130 422,144 Q422,130 408,130 Q422,130 422,116 Z" fill="#ffffff"/>
    <!-- Yellow Sparkle -->
    <path d="M315,135 Q315,145 325,145 Q315,145 315,155 Q315,145 305,145 Q315,145 315,135 Z" fill="#fef08a"/>
    <!-- Cyan Sparkle -->
    <path d="M435,231 Q435,240 444,240 Q435,240 435,249 Q435,240 426,240 Q435,240 435,231 Z" fill="#38bdf8"/>

    <!-- 7. Bottom OFFLINE ADVENTURE Pill Badge -->
    <rect x="152" y="460" width="208" height="26" rx="13" ry="13" fill="rgba(15, 23, 42, 0.92)" stroke="rgba(56, 189, 248, 0.55)" stroke-width="1.5"/>
    <circle cx="168" cy="473" r="4" fill="#22c55e"/>
    <text x="264" y="477" fill="#f1f5f9" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="bold" text-anchor="middle">OFFLINE ADVENTURE</text>

    <!-- 8. Inner Glow Border Rim -->
    <rect x="3" y="3" width="506" height="506" rx="105" ry="105" fill="none" stroke="#38bdf8" stroke-width="5" opacity="0.38"/>
  </g>
</svg>